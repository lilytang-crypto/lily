const essays=[
['推荐一个好地方','藏在城市里的小森林',`周末，我最喜欢去家附近的滨河公园。它不像游乐园那样热闹，却像一片藏在城市里的小森林，让人一走进去就慢下来。
清晨，河面蒙着薄薄的雾，木栈道被露水洗得发亮。沿着小路往前走，左边是一排高大的梧桐，右边是随风轻轻摇摆的芦苇。偶尔有白鹭从水面掠过，翅尖像是碰到了水，留下一圈圈银亮的波纹。最有趣的是石桥下的小鱼。只要撒下一点鱼食，它们就会从四面八方赶来，红的、金的、黑的，挤成一团，好像正在参加水下运动会。
公园中央有一块大草坪。春天可以追风筝，夏天可以在树荫下看书，秋天能收集形状各异的落叶，冬天则能观察结在草尖上的白霜。我还喜欢坐在河边的长椅上，把看到的云、树和小动物写进日记。
如果你想找一个既能运动、又能安静观察自然的地方，我一定推荐滨河公园。这里没有昂贵的门票，却每天都准备着新的风景。`],
['我的家人','我家的“故事大王”',`我的爸爸是我们家的“故事大王”。他个子不算高，鼻梁上架着一副黑框眼镜。白天，他工作很忙；到了晚上，只要我说一句“爸爸，讲个故事吧”，他就会立刻放下手机，清清嗓子，神秘地说：“今晚的故事可不一般。”
爸爸讲故事从来不照着书念。他会给不同人物配上不同的声音：老爷爷说话慢吞吞，小松鼠又尖又快，大怪兽则故意压低嗓门。有一次，他讲到小狐狸掉进陷阱，突然停住了。我急得拉住他的衣角，问：“后来呢？”他眨眨眼，让我自己想办法。我说可以用树枝搭梯子，他便顺着我的主意继续编。没想到，第二天他还把这个故事画成四格漫画，贴在我的书桌前。
爸爸也有严肃的时候。遇到我做错事，他不会马上批评，而是让我把事情从头讲一遍，再问：“如果重来一次，你会怎么做？”这样一问，我常常自己就明白了问题。
在我心里，爸爸的故事不只好听，还藏着勇气、善良和办法。我希望长大后，也能像他一样，用有趣的故事给别人带来快乐。`],
['写观察日记','绿豆发芽记',`9月18日 星期三 晴
今天，我把十几颗绿豆放进透明杯，倒入清水。它们圆圆的、硬硬的，像一颗颗浅绿色的小石子。两个小时后，绿豆喝足了水，身体比原来胖了一圈，颜色也淡了。我把水倒掉，盖上一张湿纸巾，期待明天的变化。
9月19日 星期四 多云
早晨，我迫不及待地跑到窗台。绿豆的外衣裂开了一条小缝，露出乳白色的身体。有几颗已经钻出短短的嫩芽，弯弯的，像小象刚长出的牙。我用尺量了量，最长的一根大约有五毫米。晚上再看时，它竟然又长了一点。
9月21日 星期六 晴
嫩芽越长越长，绿豆皮被完全撑开，有的已经脱落。白色的根向下伸，淡黄的小茎努力向上，顶端还合着两片小叶子。我把杯子转了一个方向，第二天发现小苗又朝着窗外的阳光弯过去。
一颗不起眼的绿豆，几天里竟发生了这么多变化。只要耐心观察，窗台也能变成一间有趣的自然实验室。`],
['我和谁过一天','我和孙悟空过一天',`清晨，一阵“呼——呼——”的风把我从床上吹了起来。睁眼一看，孙悟空正扛着金箍棒站在窗前。他笑道：“麻糖，今天跟俺老孙去花果山！”还没等我回答，筋斗云已经托着我们飞上天空。
花果山的瀑布像一条白色巨龙，从高高的山崖冲下来。小猴子们送来桃子，最大的一个比我的脸还圆。孙悟空教我爬树，可我刚爬到一半就滑了下来。他拔下一根毫毛，轻轻一吹，变出一张软网接住了我。
午后，我们发现山脚的小溪被倒下的树干堵住，水快要漫进猴群的家。孙悟空举起金箍棒，想一下把树挑走。我连忙说：“等等，树下可能藏着小动物。”我们仔细查看，果然发现两窝小刺猬。把它们安全转移后，悟空变出许多小猴，大家一起清理树枝、疏通水道。溪水重新唱起歌来。
夕阳下，孙悟空送我回家。他说：“力气大不算真正的本领，肯动脑、会关心别人才厉害。”我望着远去的筋斗云，觉得这一天像梦，却把这句话牢牢记在了心里。`],
['生活万花筒','停电的晚上',`“啪”的一声，屋里突然黑了，空调停了，电视也没了声音。窗外的楼房一栋接一栋暗下去，原来小区停电了。
起初我有些害怕，赶紧摸索着去找妈妈。爸爸打开手机手电筒，光柱在墙上晃来晃去，像一只调皮的小白兔。妈妈找出三支蜡烛，客厅很快亮起暖黄色的光。没有电视和网络，我们决定玩影子游戏。爸爸把两只手交叉，墙上立刻出现一只张嘴的“大灰狼”；妈妈的手指一弯，又变成一只长耳朵的小兔。我也试着做小狗，可影子怎么看都像一只胖鸭子，大家笑得前仰后合。
后来，我们把椅子搬到阳台。平时不起眼的夜空，竟然露出了许多星星。风从楼间吹来，带着树叶的清香。爸爸讲起他小时候没有手机，夏夜常和伙伴数星星、捉萤火虫。我第一次发现，安静地听家人说话，也是一件很有意思的事。
灯重新亮起时，我们反而有一点舍不得。那次停电拿走了电器的光，却让一家人靠得更近，也给普通的晚上添上了一颗闪亮的星。`],
['记一次游戏','难忘的接力赛',`“四年级接力赛马上开始！”广播声一响，操场立刻沸腾起来。我们班的四名队员站上跑道，我负责最后一棒。握着接力棒时，我的手心全是汗，心像一只小鼓咚咚直响。
发令枪响，第一棒的小宇像箭一样冲了出去。第二棒交接顺利，我们暂时领先。可是第三棒转弯时脚下一滑，身体晃了一下，旁边的班级超过了我们。看台上传来整齐的喊声：“四班加油！”我盯着越来越近的队友，把手向后伸得笔直。
“接住！”接力棒稳稳落进我的手心。我顾不上紧张，只听见风从耳边呼呼刮过。前面的同学离我还有几米，我咬紧牙关，加快摆臂。终点就在眼前，我用尽全身力气向前一扑，和他几乎同时压线。裁判举起牌子——我们赢了半个身位！
同学们一下围上来，有人拍我的肩，有人扶住气喘吁吁的第三棒。那一刻我明白，胜利不属于最后冲线的一个人，而属于每一只紧握接力棒的手。`],
['写信','给未来的自己',`未来的麻糖：
你好！当你读到这封信时，也许已经长高了许多，也学会了现在觉得很难的本领。你还记得四年级的自己吗？我写字有点慢，遇到复杂的计算有时会着急，可我正在参加“小蜗牛变形计”，每天十五分钟，认真写下一段话。妈妈说，蜗牛虽然走得慢，却会留下亮晶晶的路。
我希望你没有忘记阅读。现在的我喜欢在周末窝在沙发上看故事，也喜欢把有趣的句子抄进本子。将来的你如果遇到烦恼，就翻开一本书吧，那里常常藏着新的办法。我还希望你保持好奇心：看到奇怪的云，查一查它为什么形成；做实验失败了，再想想是哪一步出了问题。
请你记得感谢家人和老师，也要对朋友真诚。如果你已经实现了一个大目标，别忘了给自己鼓掌；如果还没有，也不用灰心。慢一点没有关系，只要方向正确，每一天都比昨天多走一步。
祝你勇敢、善良，眼里一直有光！
四年级的麻糖`],
['我的心儿怦怦跳','第一次独自上台',`主持人念到我的名字时，我的心猛地一跳。虽然这篇演讲已经练了许多遍，可真正站到舞台边，我还是觉得双腿发软，手里的稿纸也沙沙发抖。
“下一位，麻糖。”老师轻轻推了推我的肩。我深吸一口气，走上台。聚光灯照得我睁不开眼，台下黑压压的人群像一片安静的海。我张开嘴，第一句话竟然卡在喉咙里。就在这时，我看见第一排的妈妈朝我笑了笑，班主任也悄悄竖起大拇指。
我想起练习时老师说的话：“别想着下面有多少人，就当是在给一个好朋友讲故事。”我再次吸气，终于说出了开头。渐渐地，那些熟悉的句子一个个跑了出来。讲到有趣的地方，台下有人笑；讲到结尾，掌声像潮水一样涌来。
走下舞台，我才发现后背已经湿了，心还在怦怦跳，可那不再只是害怕，里面还混着兴奋和自豪。原来勇敢不是一点儿也不紧张，而是心里打着鼓，脚步仍然向前。`]

const poems=[['《暮江吟》·白居易','一道残阳铺水中，半江瑟瑟半江红。\n可怜九月初三夜，露似真珠月似弓。','会背、会默写，注意“瑟瑟、真珠”。'],['《题西林壁》·苏轼','横看成岭侧成峰，远近高低各不同。\n不识庐山真面目，只缘身在此山中。','会背、会默写，理解观察角度不同。'],['《雪梅》·卢钺','梅雪争春未肯降，骚人阁笔费评章。\n梅须逊雪三分白，雪却输梅一段香。','会背、会默写，理解各有所长。'],['《鹿柴》·王维','空山不见人，但闻人语响。\n返景入深林，复照青苔上。','第一单元日积月累。'],['《精卫填海》·《山海经》','炎帝之少女，名曰女娃。女娃游于东海，溺而不返，故为精卫，常衔西山之木石，以堙于东海。','会背，能借助注释讲故事。'],['现代课文重点段落','《观潮》按教材要求背诵潮来时重点段落；《繁星》积累喜欢的语句。','请对照纸质教材背诵，站内不复制受版权保护的现代课文全文。']];

const science=[
['空气1 感受空气','空气无色、无味、透明，会流动；它就在我们周围。','用塑料袋在教室里兜气并扎紧；按压、松手，描述感觉。','空气真实存在，会流动。'],['空气2 占据空间','空气和水、固体一样占据空间。','杯底塞纸，杯口向下竖直压入水中；取出检查纸，再倾斜杯子观察气泡。','空气占据空间。'],['空气3 空间会改变','空气容易被压缩，也会膨胀；压缩空气有弹性。','堵住注射器口，推拉活塞，记录刻度和手感。','空气占据的空间可以改变。'],['空气4 空气有质量','空气虽然很轻，但有质量。','两只气球挂在尺子两端调平；给一只充气后再比较。','充气一端下沉，说明空气有质量。'],['空气5 流动有力量','流动空气能推动物体，风能可被利用。','制作气球小车或纸风车；改变吹气大小，比较运动。','空气流动越快，作用通常越明显。'],['空气6 热气球','热空气膨胀、变轻并上升；冷却后下降。','成人看护下，用安全热源加热薄纸袋内空气并观察。','热空气上升，实验必须远离明火。'],['空气7 风的成因','冷热不均使空气流动，热空气上升，冷空气来补充。','用纸箱和安全烟雾观察热源附近气流方向。','温差→空气流动→风。'],['空气8 自制打气筒','活塞改变空气空间，阀门让空气单向流动。','用针筒、软管和简易单向阀组装并测试。','利用空气可压缩和流动的性质。'],
['呼吸1 呼吸与消化','呼吸提供氧气并排出二氧化碳；消化让营养被吸收。','安静和运动后各数1分钟呼吸，比较。','运动后需更多氧气，呼吸加快。'],['呼吸2 呼吸器官','空气经鼻腔、咽、喉、气管、支气管进入肺。','在器官图上用箭头画空气路线。','鼻腔→咽→喉→气管→支气管→肺。'],['呼吸3 呼吸变化','运动越剧烈，呼吸次数通常越多，休息后恢复。','安静、慢走、开合跳后分别测1分钟呼吸。','比较实验要控制运动时间相同。'],['呼吸4 测肺活量','肺活量是尽力吸气后一次尽力呼出的气体量。','用一次性吹嘴，深吸后连续吹完，测3次取最好。','测量后要休息，不要过度吹气。'],['消化5 口腔消化','牙齿磨碎、舌搅拌、唾液湿润并初步消化淀粉。','慢慢嚼无糖馒头，记录味道变化。','细嚼慢咽可减轻消化负担。'],['消化6 胃和小肠','胃进一步消化；小肠是消化和吸收营养的主要场所。','密封袋加入软食和少量水，揉捏模拟胃。','胃重在消化，小肠重在消化与吸收。'],['消化7 食物旅行','食物经口腔、食道、胃、小肠、大肠。','在人形图上摆放器官卡并连接。','口腔→食道→胃→小肠→大肠。'],['消化8 呵护器官','均衡饮食、细嚼慢咽、运动和睡眠有助健康。','记录一天食物并分类，检查是否均衡。','不暴饮暴食，远离烟草。'],
['声音1 怎样产生','声音由物体振动产生，振动停止，声音停止。','拨尺子、敲音叉，观察或触摸振动。','物体发声时一定在振动。'],['声音2 强弱','振幅越大声音越强，振幅越小声音越弱。','用不同力度拨同一根橡皮筋。','强弱看振幅。'],['声音3 高低','振动越快音高越高，越慢音高越低。','改变尺子伸出桌边的长度再拨动。','短、紧、细的发声体通常音高较高。'],['声音4 乐器变化','改变弦长、松紧、粗细或空气柱长度可改变音高。','制作橡皮筋琴，一次只改变一个条件。','公平实验一次只改变一个条件。'],['声音5 设计乐器','乐器需要发声体、共鸣结构和可控制的音高或节奏。','画设计图，标材料尺寸和发声方法，再制作。','先设计、再制作、后评价。'],['声音6 改进乐器','按音量、音准、牢固、美观测试并改进。','同伴打分，每次改一个问题后复测。','工程设计需要不断测试改进。'],['声音7 声音传播','声音可在气、液、固体传播，不能在真空传播。','做土电话，比较棉线绷紧和放松时的声音。','振动通过介质传到耳朵。'],['声音8 保护听力','声音过强或持续过久会损伤听力。','调查噪声并提出降音量、拉距离、减时间的办法。','耳机遵守约60%音量、60分钟原则。']];
const st=JSON.parse(localStorage.getItem('matang-v3')||'{"day":1,"done":{},"points":0}');let installEvent;const save=()=>localStorage.setItem('matang-v3',JSON.stringify(st));const task=(id,t,p=10)=>`<label class="task"><input type="checkbox" data-task="${id}" data-pts="${p}" ${st.done[id]?'checked':''}><span>${t}</span><b class="pill">+${p}</b></label>`;
function today(){let e=essays[Math.floor((st.day-1)/2)%8],s=science[(st.day-1)%24],done=['cn','en','ma','sc'].filter(x=>st.done[`${x}-${st.day}`]).length;return `<section id="today" class="section active"><div class="hero"><h2>🌸 今日学习地图</h2><div class="progress"><i style="width:${done*25}%"></i></div><div class="stats"><div class="stat"><b>${done}/4</b>今日完成</div><div class="stat"><b>${st.points}</b>累计星星</div><div class="stat"><b>${Math.floor(st.points/100)}</b>可兑奖励</div></div></div><div class="cards"><div class="card"><h3>📖 语文</h3><p>背诵＋小蜗牛15分钟练字。</p>${task(`cn-${st.day}`,`复习${poems[(st.day-1)%poems.length][0]}；抄写《${e[1]}》第${(st.day-1)%2+1}段。`,15)}</div><div class="card"><h3>🌍 英语</h3><p>每日20词，听读、认读、拼写。</p>${task(`en-${st.day}`,'20词听读两遍，至少正确拼写16词。',15)}</div><div class="card"><h3>🧮 数学</h3><p>20道计算，建议12分钟。</p>${task(`ma-${st.day}`,'完成计算，错题重新算一遍。',15)}</div><div class="card"><h3>🔬 科学</h3><p>${s[0]}：${s[1]}</p>${task(`sc-${st.day}`,'口述核心结论和实验步骤。',15)}</div></div></section>`}
function chinese(){return `<section id="chinese" class="section"><div class="hero"><h2>📖 语文成长馆</h2><p>新版统编四年级上册背诵清单＋8个单元原创范文。</p></div><h3>背诵闯关</h3><div class="library">${poems.map((p,i)=>`<details class="lesson"><summary>${p[0]}<span class="pill">第${i+1}关</span></summary><div class="body"><div class="poem">${p[1]}</div><p>${p[2]}</p>${task(`poem-${i}`,'完整背诵，并默写检查。')}</div></details>`).join('')}</div><h3>8单元习作范文（原创 · 约420字）</h3><div class="library">${essays.map((e,i)=>`<details class="lesson"><summary>第${i+1}单元 · ${e[0]}<span class="pill">范文</span></summary><div class="body"><h3>${e[1]}</h3><div class="essay">${e[2]}</div><p class="notice">先找开头、重点事例和结尾，再圈出3个可借鉴的词句，不整篇照抄。</p></div></details>`).join('')}</div></section>`}
function snail(){let e=essays[Math.floor((st.day-1)/2)%8],part=(st.day-1)%2,clean=e[2].replace(/\n/g,''),mid=Math.ceil(clean.length/2),txt=part?clean.slice(mid):clean.slice(0,mid);return `<section id="snail" class="section"><div class="hero"><h2>🐌 小蜗牛变形计</h2><p>每天约200字 · 15分钟 · 一篇作文分两天。先端正，再逐渐提速。</p><div class="timer" id="timer">15:00</div><div class="toolbar"><button class="primary" id="startTimer">▶ 开始</button><button class="ghost" id="resetTimer">重置</button></div></div><div class="card"><span class="pill">《${e[1]}》第${part+1}天</span><div class="essay" style="font-size:18px;margin-top:13px">${txt}</div><p>自查：坐姿端正 □　大小均匀 □　标点占格 □　卷面整洁 □</p>${task(`snail-${st.day}`,'15分钟认真写完，并圈出最满意的3个字。',20)}<p>完成字数：<input class="answer" id="count" type="number" style="max-width:140px"> <span id="speed"></span></p></div></section>`}
function english(){let d=((st.day-1)%6)*20,ws=words.slice(d,d+20);if(ws.length<20)ws=ws.concat(words.slice(0,20-ws.length));let units=['Helping at home','My friends','Places we live in','Helping in the community','The weather and us','Changing for the seasons'];return `<section id="english" class="section"><div class="hero"><h2>🌍 英语 · Unit ${(st.day-1)%6+1}</h2><p>${units[(st.day-1)%6]} · 今日20词</p><div class="toolbar"><button class="primary" id="readWords">🔊 连续听读</button><button class="ghost" id="checkSpell">检查拼写</button><button class="ghost" id="clearSpell">清空</button></div></div><div class="wordgrid">${ws.map(w=>`<div class="word"><b>${w[0]}</b><button class="ghost speak" data-word="${w[0]}" style="padding:4px">🔊</button><small>${w[1]}</small><input data-spell="${w[0].toLowerCase()}" placeholder="遮住英文再拼"></div>`).join('')}</div><div class="card" style="margin-top:15px"><h3>课文句型</h3><p>${[['What chores do you do?','I sweep the floor.'],['What is your friend like?','She is kind and quiet.'],['Is there a library?','Yes, there is.'],['What does a firefighter do?','A firefighter helps people.'],["What's the weather like?","It's sunny and warm."],['Which season do you like?','I like spring.']][(st.day-1)%6].join('<br>')}</p>${task(`sentence-${st.day}`,'脱离提示说出问句和答句。')}</div></section>`}
function calcs(){let a=[],seed=st.day*7919,r=(n,m)=>(seed=(seed*9301+49297)%233280,n+seed%(m-n+1));for(let i=0;i<8;i++){let x=r(120,899),y=r(11,89);a.push([`${x} × ${y}`,x*y])}for(let i=0;i<4;i++){let x=r(10000,999999),y=r(1000,99999);a.push([`${x} + ${y}`,x+y])}for(let i=0;i<4;i++){let y=r(1000,99999),x=r(y+10000,999999);a.push([`${x} − ${y}`,x-y])}for(let i=0;i<4;i++){let y=r(12,98),q=r(10,99);a.push([`${y*q} ÷ ${y}`,q])}return a}
function math(){let topics=['万以上数的认识','1亿有多大','角的度量','多位数乘两位数','加法模型和乘法模型','平行四边形和梯形','条形统计图','复习与关联'],tips=['读大数先四位分级，从高位读起；每级末尾的0不读，级中连续的0只读一个。','用时间、长度、数量的估计建立“1亿”的数感。','量角：中心对顶点，0刻度线对一边，看另一边刻度。','先乘个位，再乘十位；第二个积向左错一位，最后相加。','加法模型：部分＋部分＝总量；乘法模型：每份数×份数＝总量。','两组对边分别平行的是平行四边形；只有一组平行的是梯形。','看统计图先找标题、横轴、纵轴和单位。','先找数量关系，再列式计算，最后检查单位和答句。'];return `<section id="math" class="section"><div class="hero"><h2>🧮 数学计算加油站</h2><p>${topics[(st.day-1)%8]} · 20题 · 建议12分钟</p><div class="toolbar"><button class="primary" id="checkCalc">检查20题</button><button class="ghost" id="showCalc">显示答案</button></div><p class="notice">${tips[(st.day-1)%8]}</p></div><div class="calc">${calcs().map((c,i)=>`<label><span>${i+1}. ${c[0]} =</span><input class="answer" data-calc="${c[1]}" inputmode="numeric"></label>`).join('')}</div></section>`}
function sci(){return `<section id="science" class="section"><div class="hero"><h2>🔬 科学实验室</h2><p>24课核心知识、实验步骤和必背结论。涉及热源或尖锐物品必须由成人陪同。</p></div>${['第一单元 · 空气','第二单元 · 呼吸与消化','第三单元 · 声音'].map((u,ui)=>`<h3>${u}</h3><div class="library">${science.slice(ui*8,ui*8+8).map((s,i)=>`<details class="lesson"><summary>${s[0]}<span class="pill">第${i+1}课</span></summary><div class="body"><h4>💡 核心知识</h4><p>${s[1]}</p><h4>🧪 实验步骤</h4><p>${s[2]}</p><h4>🗣️ 必背结论</h4><p class="notice">${s[3]}</p>${task(`science-${ui}-${i}`,'不看提示说出结论，并按顺序讲实验步骤。')}</div></details>`).join('')}</div>`).join('')}</section>`}
function rewards(){return `<section id="rewards" class="section"><div class="hero"><h2>⭐ 麻糖的奖励星球</h2><p>积分记录坚持，不比较快慢。每100颗星和家长兑换一次小奖励。</p><div class="reward">当前 ${st.points} ⭐</div></div><div class="cards"><div class="card"><h3>100 ⭐</h3><p>家庭电影、一起散步或20分钟自由活动。</p></div><div class="card"><h3>300 ⭐</h3><p>挑一本书、做一次自然观察或喜欢的小手工。</p></div></div><button class="ghost" id="resetProgress">清空全部进度</button></section>`}

function render(){let d=new Date;dateNum.textContent=d.getDate();dateMon.textContent=d.getMonth()+1+'月';dayNo.textContent=st.day;pages.innerHTML=today()+chinese()+math()+english()+sci()+snail()+rewards();bind()}
function bind(){document.querySelectorAll('[data-task]').forEach(x=>x.onchange=()=>{let id=x.dataset.task,p=+x.dataset.pts;if(x.checked&&!st.done[id]){st.done[id]=1;st.points+=p}else if(!x.checked&&st.done[id]){delete st.done[id];st.points=Math.max(0,st.points-p)}save();let active=document.querySelector('.section.active')?.id||'today';render();show(active)});document.querySelectorAll('.speak').forEach(b=>b.onclick=()=>{let u=new SpeechSynthesisUtterance(b.dataset.word);u.lang='en-US';speechSynthesis.speak(u)});readWords?.addEventListener('click',()=>{let u=new SpeechSynthesisUtterance([...document.querySelectorAll('.speak')].map(x=>x.dataset.word).join('. '));u.lang='en-US';u.rate=.72;speechSynthesis.speak(u)});checkSpell?.addEventListener('click',()=>document.querySelectorAll('[data-spell]').forEach(i=>{i.className=i.value.trim().toLowerCase()===i.dataset.spell?'ok':'bad'}));clearSpell?.addEventListener('click',()=>document.querySelectorAll('[data-spell]').forEach(i=>{i.value='';i.className=''}));checkCalc?.addEventListener('click',()=>document.querySelectorAll('[data-calc]').forEach(i=>{i.classList.remove('ok','bad');i.classList.add(+i.value===+i.dataset.calc?'ok':'bad')}));showCalc?.addEventListener('click',()=>document.querySelectorAll('[data-calc]').forEach(i=>i.value=i.dataset.calc));let left=900,int,draw=()=>{if(timer)timer.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')};startTimer?.addEventListener('click',()=>{clearInterval(int);int=setInterval(()=>{left--;draw();if(left<=0){clearInterval(int);alert('15分钟到！停笔，圈出最满意的3个字。')}},1000)});resetTimer?.addEventListener('click',()=>{clearInterval(int);left=900;draw()});count?.addEventListener('input',e=>speed.textContent=e.target.value?`约 ${Math.round(e.target.value/15)} 字/分钟`:``);resetProgress?.addEventListener('click',()=>{if(confirm('确定清空全部记录吗？')){st.done={};st.points=0;save();render()}})}
nav.innerHTML=navs.map((n,i)=>`<button data-page="${n[0]}" class="${i?'':'active'}"><span>${n[1]}</span>${n[2]}</button>`).join('');nav.onclick=e=>{let b=e.target.closest('button');if(b)show(b.dataset.page)};prevDay.onclick=()=>{st.day=Math.max(1,st.day-1);save();render()};nextDay.onclick=()=>{st.day=st.day%48+1;save();render()};todayBtn.onclick=()=>show('today');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;installBtn.hidden=false});installBtn.onclick=async()=>{if(installEvent){installEvent.prompt();await installEvent.userChoice;installEvent=null}};render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js');
</script></body></html>
