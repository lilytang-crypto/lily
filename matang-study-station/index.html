const units=[
['第一单元 · 追寻自然奇观','《观潮》《繁星》《现代诗二首》','边读边想象声音、色彩、形态和变化，把画面说具体。','口语交际：我们与环境','推荐一个好地方','写清地点、特别之处和推荐理由，用一个具体画面让人想去。','潮水、宽阔、逐渐、犹如、霎时、余波、繁星、芦苇'],

const essays=[["推荐一个好地方","藏在城市里的小森林","周末，我最喜欢去家附近的滨河公园。它不像游乐园那样热闹，却像一片藏在城市里的小森林，让人一走进去就慢下来。\n清晨，河面蒙着薄薄的雾，木栈道被露水洗得发亮。沿着小路往前走，左边是一排高大的梧桐，右边是随风轻轻摇摆的芦苇。偶尔有白鹭从水面掠过，翅尖像是碰到了水，留下一圈圈银亮的波纹。最有趣的是石桥下的小鱼。只要撒下一点鱼食，它们就会从四面八方赶来，红的、金的、黑的，挤成一团，好像正在参加水下运动会。\n公园中央有一块大草坪。春天可以追风筝，夏天可以在树荫下看书，秋天能收集形状各异的落叶，冬天则能观察结在草尖上的白霜。我还喜欢坐在河边的长椅上，把看到的云、树和小动物写进日记。\n沿着河岸往前走，还有一座小亭子。玩累了，我们就在亭子里喝水休息，听鸟儿唱歌。我常把落叶夹进书里，回家再比较它们的形状和颜色。\n如果你想找一个既能运动、又能安静观察自然的地方，我一定推荐滨河公园。这里没有昂贵的门票，却每天都准备着新的风景。"],["我的家人","我家的“故事大王”","我的爸爸是我们家的“故事大王”。他个子不算高，鼻梁上架着一副黑框眼镜。白天，他工作很忙；到了晚上，只要我说一句“爸爸，讲个故事吧”，他就会立刻放下手机，清清嗓子，神秘地说：“今晚的故事可不一般。”\n爸爸讲故事从来不照着书念。他会给不同人物配上不同的声音：老爷爷说话慢吞吞，小松鼠又尖又快，大怪兽则故意压低嗓门。有一次，他讲到小狐狸掉进陷阱，突然停住了。我急得拉住他的衣角，问：“后来呢？”他眨眨眼，让我自己想办法。我说可以用树枝搭梯子，他便顺着我的主意继续编。没想到，第二天他还把这个故事画成四格漫画，贴在我的书桌前。\n爸爸也有严肃的时候。遇到我做错事，他不会马上批评，而是让我把事情从头讲一遍，再问：“如果重来一次，你会怎么做？”这样一问，我常常自己就明白了问题。\n有时轮到我接着讲，我会紧张得说不下去。爸爸从不催促，只笑着问下一步会发生什么。在他的鼓励下，我也慢慢敢在大家面前讲故事了。\n在我心里，爸爸的故事不只好听，还藏着勇气、善良和办法。我希望长大后，也能像他一样，用有趣的故事给别人带来快乐。"],["写观察日记","绿豆发芽记","9月18日 星期三 晴\n今天，我把十几颗绿豆放进透明杯，倒入清水。它们圆圆的、硬硬的，像一颗颗浅绿色的小石子。两个小时后，绿豆喝足了水，身体比原来胖了一圈，颜色也淡了。我把水倒掉，盖上一张湿纸巾，期待明天的变化。\n9月19日 星期四 多云\n早晨，我迫不及待地跑到窗台。绿豆的外衣裂开了一条小缝，露出乳白色的身体。有几颗已经钻出短短的嫩芽，弯弯的，像小象刚长出的牙。我用尺量了量，最长的一根大约有五毫米。晚上再看时，它竟然又长了一点。\n9月21日 星期六 晴\n嫩芽越长越长，绿豆皮被完全撑开，有的已经脱落。白色的根向下伸，淡黄的小茎努力向上，顶端还合着两片小叶子。我把杯子转了一个方向，第二天发现小苗又朝着窗外的阳光弯过去。\n观察时，我还在纸上画下嫩芽的样子，标好日期和长度。把几天的图放在一起，变化就清清楚楚。我决定继续记录，看看叶子展开后是什么模样。\n一颗不起眼的绿豆，几天里竟发生了这么多变化。只要耐心观察，窗台也能变成一间有趣的自然实验室。"],["我和谁过一天","我和孙悟空过一天","清晨，一阵“呼——呼——”的风把我从床上吹了起来。睁眼一看，孙悟空正扛着金箍棒站在窗前。他笑道：“麻糖，今天跟俺老孙去花果山！”还没等我回答，筋斗云已经托着我们飞上天空。\n花果山的瀑布像一条白色巨龙，从高高的山崖冲下来。小猴子们送来桃子，最大的一个比我的脸还圆。孙悟空教我爬树，可我刚爬到一半就滑了下来。他拔下一根毫毛，轻轻一吹，变出一张软网接住了我。\n午后，我们发现山脚的小溪被倒下的树干堵住，水快要漫进猴群的家。孙悟空举起金箍棒，想一下把树挑走。我连忙说：“等等，树下可能藏着小动物。”我们仔细查看，果然发现两窝小刺猬。把它们安全转移后，悟空变出许多小猴，大家一起清理树枝、疏通水道。溪水重新唱起歌来。\n回家后，我把这件事画在本子上，还给小刺猬画了一个干燥温暖的新家。原来，神奇的一天不一定只靠法术，也能靠细心和大家共同的努力。\n夕阳下，孙悟空送我回家。他说：“力气大不算真正的本领，肯动脑、会关心别人才厉害。”我望着远去的筋斗云，觉得这一天像梦，却把这句话牢牢记在了心里。"],["生活万花筒","停电的晚上","“啪”的一声，屋里突然黑了，空调停了，电视也没了声音。窗外的楼房一栋接一栋暗下去，原来小区停电了。\n起初我有些害怕，赶紧摸索着去找妈妈。爸爸打开手机手电筒，光柱在墙上晃来晃去，像一只调皮的小白兔。妈妈找出三支蜡烛，客厅很快亮起暖黄色的光。没有电视和网络，我们决定玩影子游戏。爸爸把两只手交叉，墙上立刻出现一只张嘴的“大灰狼”；妈妈的手指一弯，又变成一只长耳朵的小兔。我也试着做小狗，可影子怎么看都像一只胖鸭子，大家笑得前仰后合。\n后来，我们把椅子搬到阳台。平时不起眼的夜空，竟然露出了许多星星。风从楼间吹来，带着树叶的清香。爸爸讲起他小时候没有手机，夏夜常和伙伴数星星、捉萤火虫。我第一次发现，安静地听家人说话，也是一件很有意思的事。\n我又试着做了一次手影，慢慢弯起食指，把拇指藏到后面。这回终于像小狗了！妈妈笑着鼓掌，我也忍不住摇动手指，让小狗在墙上跑了起来。\n灯重新亮起时，我们反而有一点舍不得。那次停电拿走了电器的光，却让一家人靠得更近，也给普通的晚上添上了一颗闪亮的星。"],["中国的世界文化遗产","长城：山脊上的巨龙","长城是中国著名的世界文化遗产。为了介绍它，我先翻看课本，又和爸爸查阅资料，把找到的信息分成外形、用途和保护三类。越了解，我越觉得长城值得我们珍惜。\n远远望去，长城沿着山势起伏，一会儿爬上陡峭的山脊，一会儿隐入苍翠的树林，像一条伸向天边的巨龙。走近看，厚实的城墙、整齐的城砖和高低错落的楼台，又让人感到它的坚固与雄伟。每一块砖石，都仿佛藏着一段漫长的故事。\n长城并不是一堵孤零零的墙，而是由城墙、关隘和敌楼等组成的防御体系。古时候，守军借助这些建筑观察敌情、传递消息、保护家园。山路那么崎岖，材料那么沉重，古代劳动人民却用双手把它修筑起来，多么不容易啊！\n这些古老的建筑，把过去与今天连接起来。我们走过时多一分爱护，它们就能把故事讲给更多人听。\n如今，人们登上长城，欣赏群山，也认识祖先的智慧。我想，保护长城不只是工作人员的责任。参观时不在砖石上刻字，不随手丢垃圾，沿规定路线行走，都是我们能做到的事。下次再去，我愿意当一名小小讲解员，让更多朋友了解它。"],["我的心儿怦怦跳","第一次独自上台","主持人念到我的名字时，我的心猛地一跳。虽然这篇演讲已经练了许多遍，可真正站到舞台边，我还是觉得双腿发软，手里的稿纸也沙沙发抖。\n“下一位，麻糖。”老师轻轻推了推我的肩。我深吸一口气，走上台。聚光灯照得我睁不开眼，台下黑压压的人群像一片安静的海。我张开嘴，第一句话竟然卡在喉咙里。就在这时，我看见第一排的妈妈朝我笑了笑，班主任也悄悄竖起大拇指。\n我想起练习时老师说的话：“别想着下面有多少人，就当是在给一个好朋友讲故事。”我再次吸气，终于说出了开头。渐渐地，那些熟悉的句子一个个跑了出来。讲到有趣的地方，台下有人笑；讲到结尾，掌声像潮水一样涌来。\n回到座位，我悄悄握了握拳头。妈妈轻声说，刚才的停顿没有关系，你已经认真讲完了。我点点头，决定下次再给自己一次挑战的机会。\n走下舞台，我才发现后背已经湿了，心还在怦怦跳，可那不再只是害怕，里面还混着兴奋和自豪。原来勇敢不是一点儿也不紧张，而是心里打着鼓，脚步仍然向前。"],["写信","给未来的自己","未来的麻糖：\n你好！当你读到这封信时，也许已经长高了许多，也学会了现在觉得很难的本领。你还记得四年级的自己吗？我写字有点慢，遇到复杂的计算有时会着急，可我正在参加“小蜗牛变形计”，每天十五分钟，认真写下一段话。妈妈说，蜗牛虽然走得慢，却会留下亮晶晶的路。\n我希望你没有忘记阅读。现在的我喜欢在周末窝在沙发上看故事，也喜欢把有趣的句子抄进本子。将来的你如果遇到烦恼，就翻开一本书吧，那里常常藏着新的办法。我还希望你保持好奇心：看到奇怪的云，查一查它为什么形成；做实验失败了，再想想是哪一步出了问题。\n请你记得感谢家人和老师，也要对朋友真诚。如果你已经实现了一个大目标，别忘了给自己鼓掌；如果还没有，也不用灰心。慢一点没有关系，只要方向正确，每一天都比昨天多走一步。\n祝你勇敢、善良，眼里一直有光！\n还想告诉你一件小事：最近我学会了把大任务分成几小步。做完一步就画一颗星，回头看时才发现，原来自己已经走了很远。\n四年级的麻糖"]];

['空气1 感受空气','空气无色、无味、透明，会流动；它就在我们周围。','用塑料袋在教室里兜气并扎紧；按压、松手，描述感觉。','空气真实存在，会流动。'],['空气2 占据空间','空气和水、固体一样占据空间。','杯底塞纸，杯口向下竖直压入水中；取出检查纸，再倾斜杯子观察气泡。','空气占据空间。'],['空气3 空间会改变','空气容易被压缩，也会膨胀；压缩空气有弹性。','堵住注射器口，推拉活塞，记录刻度和手感。','空气占据的空间可以改变。'],['空气4 空气有质量','空气虽然很轻，但有质量。','两只气球挂在尺子两端调平；给一只充气后再比较。','充气一端下沉，说明空气有质量。'],['空气5 流动有力量','流动空气能推动物体，风能可被利用。','制作气球小车或纸风车；改变吹气大小，比较运动。','空气流动越快，作用通常越明显。'],['空气6 热气球','热空气膨胀、变轻并上升；冷却后下降。','成人看护下，用安全热源加热薄纸袋内空气并观察。','热空气上升，实验必须远离明火。'],['空气7 风的成因','冷热不均使空气流动，热空气上升，冷空气来补充。','用纸箱和安全烟雾观察热源附近气流方向。','温差→空气流动→风。'],['空气8 自制打气筒','活塞改变空气空间，阀门让空气单向流动。','用针筒、软管和简易单向阀组装并测试。','利用空气可压缩和流动的性质。'],
['呼吸1 呼吸与消化','呼吸提供氧气并排出二氧化碳；消化让营养被吸收。','安静和运动后各数1分钟呼吸，比较。','运动后需更多氧气，呼吸加快。'],['呼吸2 呼吸器官','空气经鼻腔、咽、喉、气管、支气管进入肺。','在器官图上用箭头画空气路线。','鼻腔→咽→喉→气管→支气管→肺。'],['呼吸3 呼吸变化','运动越剧烈，呼吸次数通常越多，休息后恢复。','安静、慢走、开合跳后分别测1分钟呼吸。','比较实验要控制运动时间相同。'],['呼吸4 测肺活量','肺活量是尽力吸气后一次尽力呼出的气体量。','用一次性吹嘴，深吸后连续吹完，测3次取最好。','测量后要休息，不要过度吹气。'],['消化5 口腔消化','牙齿磨碎、舌搅拌、唾液湿润并初步消化淀粉。','慢慢嚼无糖馒头，记录味道变化。','细嚼慢咽可减轻消化负担。'],['消化6 胃和小肠','胃进一步消化；小肠是消化和吸收营养的主要场所。','密封袋加入软食和少量水，揉捏模拟胃。','胃重在消化，小肠重在消化与吸收。'],['消化7 食物旅行','食物经口腔、食道、胃、小肠、大肠。','在人形图上摆放器官卡并连接。','口腔→食道→胃→小肠→大肠。'],['消化8 呵护器官','均衡饮食、细嚼慢咽、运动和睡眠有助健康。','记录一天食物并分类，检查是否均衡。','不暴饮暴食，远离烟草。'],
['声音1 怎样产生','声音由物体振动产生，振动停止，声音停止。','拨尺子、敲音叉，观察或触摸振动。','物体发声时一定在振动。'],['声音2 强弱','振幅越大声音越强，振幅越小声音越弱。','用不同力度拨同一根橡皮筋。','强弱看振幅。'],['声音3 高低','振动越快音高越高，越慢音高越低。','改变尺子伸出桌边的长度再拨动。','短、紧、细的发声体通常音高较高。'],['声音4 乐器变化','改变弦长、松紧、粗细或空气柱长度可改变音高。','制作橡皮筋琴，一次只改变一个条件。','公平实验一次只改变一个条件。'],['声音5 设计乐器','乐器需要发声体、共鸣结构和可控制的音高或节奏。','画设计图，标材料尺寸和发声方法，再制作。','先设计、再制作、后评价。'],['声音6 改进乐器','按音量、音准、牢固、美观测试并改进。','同伴打分，每次改一个问题后复测。','工程设计需要不断测试改进。'],['声音7 声音传播','声音可在气、液、固体传播，不能在真空传播。','做土电话，比较棉线绷紧和放松时的声音。','振动通过介质传到耳朵。'],['声音8 保护听力','声音过强或持续过久会损伤听力。','调查噪声并提出降音量、拉距离、减时间的办法。','耳机遵守约60%音量、60分钟原则。']];
const old=JSON.parse(localStorage.getItem('matang-v4')||localStorage.getItem('matang-v3')||'{"day":1,"done":{},"points":0,"weekBonuses":{}}');const st={day:old.day||1,done:old.done||{},points:old.points||0,weekBonuses:old.weekBonuses||{}};let installEvent;

function required(w){let a=[];for(let k=0;k<7;k++){let d=(w-1)*7+k+1;if(k<5)a.push(`cn-${d}`,`en-${d}`,`ma-${d}`);if(k===1||k===3)a.push(`sc-${d}`);a.push(`snail-${d}`);if([0,2,3,6].includes(k))a.push(`guzheng-${d}`);if(k===5)a.push(`guzheng-class-${d}`);if(k===6)a.push(`badminton-${d}`);if(k===1||k===5)a.push(`ext-en-class-${d}`,`ext-en-homework-${d}`)}return a}function progress(w){let a=required(w),n=a.filter(x=>st.done[x]).length;return{n,total:a.length,pct:Math.round(n/a.length*100)}}function bonus(w){let p=progress(w),k=String(w);if(p.n===p.total&&!st.weekBonuses[k]){st.weekBonuses[k]=1;st.points+=100;save();return true}if(p.n<p.total&&st.weekBonuses[k]){delete st.weekBonuses[k];st.points=Math.max(0,st.points-100);save()}return false}
function interest(d){let k=dowOf(d),a=[];if([0,2,3,6].includes(k))a.push(task(`guzheng-${d}`,'古筝弹奏练习30分钟：慢练难点＋完整演奏1遍。',10));if(k===5)a.push(task(`guzheng-class-${d}`,'参加周六古筝课，记下老师要求的1个重点。',20));if(k===6)a.push(task(`badminton-${d}`,'周日完成本周1次羽毛球运动（建议40分钟）。',20));if(k===1||k===5){a.push(task(`ext-en-class-${d}`,`参加${k===1?'周二':'周六'}课外班英语。`,10));a.push(task(`ext-en-homework-${d}`,`完成${k===1?'周二':'周六'}课外班英语作业，并检查订正。`,15))}return a.join('')||'<div class="empty">今天没有固定兴趣班任务，可以自由阅读或休息。</div>'}
function school(d){let k=dowOf(d),u=unitOf(d);if(k>4)return`<div class="card"><h3>🐌 每日语文抄写</h3><p>每天约200字 · 15分钟 · 一篇约420字作文分两天抄写。</p>${task(`snail-${d}`,'完成今日抄写，并圈出最满意的3个字。',15)}</div>`;let cn=['朗读本周课文并积累8个重点词。','用本单元阅读方法完成1次课文批注。','完成背诵/积累检查，订正1处易错字。','围绕本单元口语或表达任务说2分钟。',`完成“${u[4]}”构思、片段或修改。`][k];return`<div class="cards"><div class="card"><h3>📖 语文</h3><p>${u[0]}<br>${u[1]}</p>${task(`cn-${d}`,cn,15)}</div><div class="card"><h3>🌍 英语</h3><p>20词听读、认读，再进入拼写模式。</p>${task(`en-${d}`,'听读两遍并完成拼写检查，错词再拼一次。',15)}</div><div class="card"><h3>🧮 数学</h3><p>每日10题：乘法、除法、小数加减。</p>${task(`ma-${d}`,'完成10题并逐题检查，错题重新计算。',15)}</div>${(k===1||k===3)?`<div class="card"><h3>🔬 科学</h3><p>${science[(d-1)%24][0]}：${science[(d-1)%24][1]}</p><h4>实验步骤</h4><p>${science[(d-1)%24][2]}</p><h4>重点结论</h4><p>${science[(d-1)%24][3]}</p>${task(`sc-${d}`,'口述核心结论，并举一个生活中的例子。',10)}</div>`:''}${true?`<div class="card"><h3>🐌 小蜗牛练字</h3><p>每天约200字 · 15分钟 · 一篇约420字作文分两天。</p>${task(`snail-${d}`,'端正书写15分钟，并圈出最满意的3个字。',15)}</div>`:''}</div>`}
function today(){let w=weekOf(st.day),p=progress(w),u=unitOf(st.day);return`<section id="today" class="section active"><div class="hero"><h2>🌸 本周学习地图</h2><p>${u[0]} · ${DAYS[dowOf(st.day)]}</p><div class="progress"><i style="width:${p.pct}%"></i></div><div class="stats"><div class="stat"><b>${p.n}/${p.total}</b>本周任务</div><div class="stat"><b>${st.points}</b>累计积分</div><div class="stat"><b>${p.pct}%</b>本周完成率</div></div></div>${school(st.day)}<div class="card"><h3>🎵 今日兴趣与课外班</h3>${interest(st.day)}</div></section>`}

function calcs(){let a=[],seed=st.day*7919,r=(n,m)=>(seed=(seed*9301+49297)%233280,n+seed%(m-n+1));for(let i=0;i<4;i++){let x=r(120,999),y=r(12,89);a.push([`${x} × ${y}`,String(x*y)])}for(let i=0;i<3;i++){let y=i===0?r(2,9):r(11,89),q=r(12,999),rem=i===2?r(0,y-1):0;a.push([`${y*q+rem} ÷ ${y}`,rem?`${q}余${rem}`:String(q)])}for(let i=0;i<3;i++){let x=r(105,999)/10,y=r(11,399)/10,add=i!==1,ans=add?x+y:Math.max(x,y)-Math.min(x,y);a.push([add?`${x.toFixed(1)} + ${y.toFixed(1)}`:`${Math.max(x,y).toFixed(1)} − ${Math.min(x,y).toFixed(1)}`,ans.toFixed(1).replace(/\.0$/,'')])}return a}
function math(){return`<section id="math" class="section"><div class="hero"><h2>🧮 每日计算10题</h2><p>4题三位数乘两位数 · 3题多位数除以一位数或两位数 · 3题小数加减</p><div class="toolbar"><button class="primary" id="checkCalc">检查10题</button><button class="ghost" id="clearCalc">清空作答</button></div><p class="notice">先估算，再列竖式。除法有余数时写“商余余数”，例如：23余4。</p></div><div class="calc">${calcs().map((c,i)=>`<label><span>${i+1}. ${c[0]} =</span><input class="answer" data-calc="${c[1]}" inputmode="decimal"></label>`).join('')}</div></section>`}

function snail(){let e=essays[Math.floor((st.day-1)/2)%8],part=(st.day-1)%2,clean=e[2].replace(/\n/g,''),mid=Math.ceil(clean.length/2),txt=part?clean.slice(mid):clean.slice(0,mid);return `<section id="snail" class="section"><div class="hero"><h2>🐌 小蜗牛变形计</h2><p>每天约200字 · 15分钟 · 一篇作文分两天。先端正，再逐渐提速。</p><div class="timer" id="timer">15:00</div><div class="toolbar"><button class="primary" id="startTimer">▶ 开始</button><button class="ghost" id="resetTimer">重置</button></div></div><div class="card"><span class="pill">《${e[1]}》第${part+1}天</span><div class="essay" style="font-size:18px;margin-top:13px">${txt}</div><p>自查：坐姿端正 □　大小均匀 □　标点占格 □　卷面整洁 □</p>${task(`snail-${st.day}`,'15分钟认真写完，并圈出最满意的3个字。',15)}<p>完成字数：<input class="answer" id="count" type="number" style="max-width:140px"> <span id="speed"></span></p></div></section>`}

function rewards(){let w=weekOf(st.day),p=progress(w),full=!!st.weekBonuses[String(w)];return`<section id="rewards" class="section"><div class="hero"><h2>⭐ 第${w}周成长奖励</h2><p>本周固定任务共${p.total}项；全部完成后自动加100分，并获得“周满贯奖励券”。</p><div class="progress"><i style="width:${p.pct}%"></i></div><div class="reward">${p.n}/${p.total} 项 · ${p.pct}% ${full?'🏆 已获得周满贯':'⭐'}</div></div><div class="cards"><div class="card"><h3>达到80%</h3><p>获得“坚持徽章”，一起复盘没完成的原因，不补罚、不清零。</p></div><div class="card"><h3>全部完成</h3><p>自动奖励100积分，并可三选一：家庭电影夜、周末活动选择权、一本书或手工材料（预算由家长约定）。</p></div><div class="card"><h3>连续4周满贯</h3><p>安排一次体验型大奖励：郊游、博物馆、运动体验或亲子活动。</p></div><div class="card"><h3>补做规则</h3><p>周日以前补齐漏项仍算完成；周奖励只看本周固定任务是否全部完成。</p></div></div><h3>本周7天</h3><div class="weekgrid">${DAYS.map((x,k)=>{let d=(w-1)*7+k+1,ids=required(w).filter(id=>id.endsWith(`-${d}`)),n=ids.filter(id=>st.done[id]).length;return`<div class="weekcell ${k===dowOf(st.day)?'current':''}"><span>${x}</span><b>${n}/${ids.length}</b></div>`}).join('')}</div><div class="toolbar" style="margin-top:20px"><button class="ghost" id="resetProgress">清空全部进度</button></div></section>`}
function show(id){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));scrollTo(0,0)}function render(){let d=new Date;dateNum.textContent=d.getDate();dateMon.textContent=d.getMonth()+1+'月';weekNo.textContent=weekOf(st.day);weekday.textContent=DAYS[dowOf(st.day)];pages.innerHTML=today()+chinese()+math()+english()+sci()+snail()+interests()+rewards();bind()}
function bind(){document.querySelectorAll('[data-task]').forEach(x=>x.onchange=()=>{let id=x.dataset.task,p=+x.dataset.pts;if(x.checked&&!st.done[id]){st.done[id]=p;st.points+=p}else if(!x.checked&&st.done[id]){st.points=Math.max(0,st.points-(st.done[id]===1?p:+st.done[id]));delete st.done[id]}let won=bonus(weekOf(st.day));save();let active=document.querySelector('.section.active')?.id||'today';render();show(active);if(won)setTimeout(()=>alert('太棒了！本周任务全部完成，已获得100积分和周满贯奖励券！'),50)});document.querySelectorAll('.speak').forEach(b=>b.onclick=()=>{let u=new SpeechSynthesisUtterance(b.dataset.word);u.lang='en-US';speechSynthesis.speak(u)});readWords?.addEventListener('click',()=>{let u=new SpeechSynthesisUtterance([...document.querySelectorAll('.speak')].map(x=>x.dataset.word).join('. '));u.lang='en-US';u.rate=.72;speechSynthesis.speak(u)});hideEnglish?.addEventListener('click',()=>{let on=!document.querySelector('.word')?.classList.contains('hide-en');document.querySelectorAll('.word').forEach(x=>x.classList.toggle('hide-en',on));hideEnglish.classList.toggle('on',on);hideEnglish.textContent=on?'显示英文':'隐藏英文'});hideChinese?.addEventListener('click',()=>{let on=!document.querySelector('.word')?.classList.contains('hide-cn');document.querySelectorAll('.word').forEach(x=>x.classList.toggle('hide-cn',on));hideChinese.classList.toggle('on',on);hideChinese.textContent=on?'显示中文':'隐藏中文'});checkSpell?.addEventListener('click',()=>document.querySelectorAll('[data-spell]').forEach(i=>{i.className=i.value.trim().toLowerCase()===i.dataset.spell?'ok':'bad'}));clearSpell?.addEventListener('click',()=>document.querySelectorAll('[data-spell]').forEach(i=>{i.value='';i.className=''}));checkCalc?.addEventListener('click',()=>document.querySelectorAll('[data-calc]').forEach(i=>{i.classList.remove('ok','bad');let v=i.value.trim().replace(/\s/g,'').replace('…','余');i.classList.add((v!==''&&(v===i.dataset.calc||(!v.includes('余')&&!i.dataset.calc.includes('余')&&Number(v)===Number(i.dataset.calc))))?'ok':'bad')}));clearCalc?.addEventListener('click',()=>document.querySelectorAll('[data-calc]').forEach(i=>{i.value='';i.classList.remove('ok','bad')}));clearInterval(window.studyTimer);let left=900,draw=()=>{if(window.timer)timer.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')};startTimer?.addEventListener('click',()=>{clearInterval(window.studyTimer);window.studyTimer=setInterval(()=>{left--;draw();if(left<=0){clearInterval(window.studyTimer);alert('15分钟到！停笔，圈出最满意的3个字。')}},1000)});resetTimer?.addEventListener('click',()=>{clearInterval(window.studyTimer);left=900;draw()});count?.addEventListener('input',e=>speed.textContent=e.target.value?`约 ${Math.round(e.target.value/15)} 字/分钟`:``);resetProgress?.addEventListener('click',()=>{if(confirm('确定清空全部记录和积分吗？')){st.done={};st.points=0;st.weekBonuses={};save();render()}})}
nav.innerHTML=navs.map((n,i)=>`<button data-page="${n[0]}" class="${i?'':'active'}"><span>${n[1]}</span>${n[2]}</button>`).join('');nav.onclick=e=>{let b=e.target.closest('button');if(b)show(b.dataset.page)};prevDay.onclick=()=>{st.day=Math.max(1,st.day-1);save();render()};nextDay.onclick=()=>{st.day=st.day%112+1;save();render()};todayBtn.onclick=()=>show('today');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;installBtn.hidden=false});installBtn.onclick=async()=>{if(installEvent){installEvent.prompt();await installEvent.userChoice;installEvent=null}};render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js');
</script></body></html>
